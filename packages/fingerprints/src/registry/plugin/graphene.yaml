name: Graphene
slug: graphene
category: plugin
website: https://www.graphene-theme.com/graphene-theme
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: '/wp-content/themes/graphene(?:-plus)?/.+graphene\.js(?:\?ver=(\d+(?:\.\d+){1,9}))?'
      version: 1
  js:
    grapheneGetInfScrollBtnLbl:
      - pattern: ''
    grapheneJS.templateUrl:
      - pattern: ''
