name: ThimPress LearnPress
slug: thimpress-learnpress
category: plugin
website: https://wordpress.org/plugins/learnpress
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: '/wp-content/plugins/learnpress/.+\.js(?:\?ver=(\d+(?:\.\d+){1,9}))?'
      version: 1
  dom:
    link[href*='/wp-content/plugins/learnpress/']:
      - pattern: ''
