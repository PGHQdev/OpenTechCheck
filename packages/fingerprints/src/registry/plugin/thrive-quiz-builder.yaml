name: Thrive Quiz Builder
slug: thrive-quiz-builder
category: plugin
website: https://thrivethemes.com/quizbuilder
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: '/wp-content/plugins/thrive-quiz-builder/.+\.js(?:\?ver=(\d+(?:\.\d+){1,9}))?'
      version: 1
  dom:
    link[href*='/wp-content/plugins/thrive-quiz-builder/']:
      - pattern: ''
