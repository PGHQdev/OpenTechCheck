name: Neve
slug: neve
category: plugin
website: https://themeisle.com/themes/neve/
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: 'themes/neve\S*\.js(?:\?ver=([0-9.]+))?'
      version: 1
  dom:
    body[class*='neve-theme']:
      - text: true
        pattern: ''
    link[id*='neve-style']:
      - attr: href
        pattern: 'neve\S*\.css(?:\?ver=([0-9.]+))?'
        version: 1
