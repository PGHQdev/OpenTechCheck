name: MailChimp for WooCommerce
slug: mailchimp-for-woocommerce
category: plugin
website: https://mailchimp.com/integrations/woocommerce
implies: [mailchimp]
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: '/wp-content/plugins/mailchimp-for-woocommerce/.+\.js(?:\?ver=(\d+(?:\.\d+){1,9}))?'
      version: 1
