name: Thrive Comments
slug: thrive-comments
category: plugin
website: https://thrivethemes.com/comments/
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: '/wp-content/plugins/thrive-comments/.+\.js(?:\?ver=(\d+(?:\.\d+){1,9}))?'
      version: 1
  dom:
    link[href*='/wp-content/plugins/thrive-comments/']:
      - pattern: ''
