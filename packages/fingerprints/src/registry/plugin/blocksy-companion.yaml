name: Blocksy Companion
slug: blocksy-companion
category: plugin
website: https://creativethemes.com/blocksy/companion/
implies: [blocksy]
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: '/wp-content/plugins/blocksy-companion(?:-pro)?/'
  dom:
    link[href*='/wp-content/plugins/blocksy-companion']:
      - attr: href
        pattern: '/wp-content/plugins/blocksy-companion(?:-pro)?/.+\.css(?:\?ver=(\d+(?:\.\d+){1,9}))?'
        version: 1
