name: Thrive Leads
slug: thrive-leads
category: plugin
website: https://thrivethemes.com/leads/
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: '/wp-content/plugins/thrive-leads/.+\.js(?:\?ver=(\d+(?:\.\d+){1,9}))?'
      version: 1
  dom:
    link[href*='/wp-content/plugins/thrive-leads/']:
      - pattern: ''
