name: Responsive Lightbox & Gallery
slug: responsive-lightbox-gallery
category: plugin
website: https://dfactory.eu/products/responsive-lightbox-gallery-extensions/
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: '/wp-content/plugins/responsive-lightbox/.+front\.js(?:\?ver=(\d+(?:\.\d+){1,9}))?'
      version: 1
  js:
    rlArgs.activeGalleries:
      - pattern: ''
    rl_hide_image:
      - pattern: ''
    rl_view_image:
      - pattern: ''
