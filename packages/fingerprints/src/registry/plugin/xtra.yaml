name: Xtra
slug: xtra
category: plugin
website: https://xtratheme.com
within:
  techs: [wordpress]
detect:
  scripts:
    - pattern: '/wp-content/themes/xtra/.+custom\.js(?:\?ver=(\d+(?:\.\d+){1,9}))?'
      version: 1
  dom:
    link[href*='/wp-content/themes/xtra/']:
      - attr: href
        pattern: '/wp-content/themes/xtra/.+core(?:-laptop|-mobile)?\.css(?:\?ver=(\d+(?:\.\d+){1,9}))?'
        version: 1
