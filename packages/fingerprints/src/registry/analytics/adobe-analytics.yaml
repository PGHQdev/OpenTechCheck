name: Adobe Analytics
slug: adobe-analytics
category: analytics
website: https://business.adobe.com/products/adobe-analytics.html
detect:
  scripts:
    - pattern: 'omtrdc\.net'
      confidence: 90
    - pattern: '(?:^|/)s_code(?:\.min)?\.js'
      confidence: 80
  cookies:
    s_vi:
      - pattern: '^\[CS\]v1'
        confidence: 80
  js:
    s.account:
      - pattern: ''
        confidence: 80
    s_c_il.0._c:
      - pattern: 's_c'
    s_c_il.0.constructor.name:
      - pattern: 'AppMeasurement'
    s_c_il.1._c:
      - pattern: 's_c'
    s_c_il.1.constructor.name:
      - pattern: 'AppMeasurement'
    s_c_il.2._c:
