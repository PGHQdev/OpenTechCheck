name: Amplitude
slug: amplitude
category: analytics
website: https://amplitude.com
detect:
  html:
    - pattern: 'cdn\.amplitude\.com/'
    - pattern: 'amplitude\.init\('
      confidence: 85
  scripts:
    - pattern: 'cdn\.amplitude\.com/'
    - pattern: 'cdn\.(?:segment.+)?amplitude(?:\.com|-plugins)'
  js:
    AMPLITUDE_KEY:
      - pattern: ''
    __AMPLITUDE__:
      - pattern: ''
    amplitudeClient:
      - pattern: ''
