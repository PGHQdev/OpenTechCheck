    - pattern: 'cdnjs\.cloudflare\.com/ajax/libs/snowplow/(?:.+)/sp.*\.js'
    - pattern: 'unpkg.com/@snowplow/javascript-tracker@(?:.+)/dist/sp.*\.js'
    - pattern: 'cdn\.jsdelivr\.net/npm/@snowplow/javascript-tracker@(?:.+)/dist/sp\.js'
