name: Vite
slug: vite
category: misc
website: https://vite.dev
detect:
  html:
    - pattern: '<script type="module" src="/@vite/client">'
  scripts:
    - pattern: '/@vite/client'
  js:
    __vite_is_modern_browser:
      - pattern: ''
  dom:
    script#vite-legacy-polyfill:
      - pattern: ''
    script#vite-legacy-entry:
      - pattern: ''
    link[href*='vite.svg'][rel='icon']:
      - pattern: ''
    script[id^='vite-plugin-']:
      - pattern: ''
