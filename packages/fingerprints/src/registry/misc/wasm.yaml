name: WebAssembly
slug: wasm
category: misc
website: https://webassembly.org
detect:
  html:
    - pattern: 'application/wasm'
      confidence: 75
  scripts:
    - pattern: '\.wasm'
      confidence: 75
    - pattern: '/wasm_exec\.js'
  headers:
    content-type:
      - pattern: 'application/wasm'
  js:
    wasmBinary:
      - pattern: ''
    wasmBinaryFile:
      - pattern: ''
