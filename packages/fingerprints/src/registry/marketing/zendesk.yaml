name: Zendesk
slug: zendesk
category: marketing
website: https://www.zendesk.com
detect:
  html:
    - pattern: 'static\.zdassets\.com/ekr/snippet\.js'
    - pattern: 'id="ze-snippet"'
      confidence: 90
  scripts:
    - pattern: 'static\.zdassets\.com/ekr/snippet\.js'
    - pattern: 'static\.zdassets\.com'
  headers:
    x-zendesk-user-id:
      - pattern: ''
  cookies:
    _help_center_session:
      - pattern: ''
    _zendesk_cookie:
      - pattern: ''
    _zendesk_shared_session:
      - pattern: ''
  js:
    Zendesk:
      - pattern: ''
