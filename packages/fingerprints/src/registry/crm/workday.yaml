name: Workday
slug: workday
category: crm
website: https://www.workday.com
detect:
  html:
    - pattern: 'wday-logo\.svg'
    - pattern: '© \d{4} Workday, Inc'
  url:
    - pattern: '(^|\.)workday\.com'
  scripts:
    - pattern: 'www\.myworkday\.com'
    - pattern: 'static\.community\.workday\.com'
  js:
    workday.appRoot:
      - pattern: ''
    workdayMessages:
      - pattern: ''
