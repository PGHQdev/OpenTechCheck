name: Apollo
slug: apollo
category: js-library
website: https://www.apollographql.com
implies: [graphql, typescript]
detect:
  headers:
    access-control-allow-headers:
      - pattern: '^x-apollo-tracing'
  js:
    __APOLLO_CLIENT__:
      - pattern: ''
    __APOLLO_CLIENT__.version:
      - pattern: '^(.+)$'
        version: 1
    __NEXT_DATA__.props.pageProps.__APOLLO_STATE__:
      - pattern: ''
  dom:
    script#__APOLLO_STATE__:
      - pattern: ''
