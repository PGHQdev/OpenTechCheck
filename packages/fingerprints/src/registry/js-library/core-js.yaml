name: core-js
slug: core-js
category: js-library
website: https://github.com/zloirock/core-js
detect:
  js:
    __core-js_shared__:
      - pattern: ''
    __core-js_shared__.versions.0.version:
      - pattern: '^(.+)$'
        version: 1
    _babelPolyfill:
      - pattern: ''
    core:
      - pattern: ''
    core.version:
      - pattern: '^(.+)$'
        version: 1
