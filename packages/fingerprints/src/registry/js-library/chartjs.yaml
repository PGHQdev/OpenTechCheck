name: Chart.js
slug: chartjs
category: js-library
website: https://www.chartjs.org
detect:
  scripts:
    - pattern: 'npm/chart\.js@([\d.]+)'
      version: 1
    - pattern: 'cdnjs\.cloudflare\.com/ajax/libs/Chart\.js/([\d.]+)/'
      version: 1
    - pattern: 'npm/chart\.js\b'
    - pattern: '/Chart\.(?:bundle|umd)(?:\.min)?\.js'
    - pattern: '/Chart(?:\.bundle)?(?:\.min)?\.js'
      confidence: 75
    - pattern: 'chartjs\.org/dist/([\d.]+(?:-[^/]+)?|master|latest)/Chart.*\.js'
      version: 1
    - pattern: 'cdnjs\.cloudflare\.com/ajax/libs/Chart\.js/([\d.]+(?:-[^/]+)?)/Chart.*\.js'
      version: 1
    - pattern: 'cdn\.jsdelivr\.net/(?:npm|gh/chartjs)/chart\.js@([\d.]+(?:-[^/]+)?|latest)/dist/Chart.*\.js'
      version: 1
  js:
    Chart.version:
      - pattern: '^([\d.]+)'
        version: 1
    Chart:
      - pattern: ''
        confidence: 50
    Chart.defaults.doughnut:
      - pattern: ''
    chart.ctx.bezierCurveTo:
      - pattern: ''
