name: Swiper
slug: swiper
category: js-library
website: https://swiperjs.com
detect:
  html:
    - pattern: 'class="[^"]*\bswiper-wrapper\b'
      confidence: 90
  scripts:
    - pattern: 'npm/swiper@([\d.]+)'
      version: 1
    - pattern: '/swiper(?:-bundle)?(?:\.min)?\.js(?:\?ver=([\d.]+))?'
      version: 1
    - pattern: 'swiper(?:\.min)?\.js'
  js:
    Swiper.prototype:
      - pattern: ''
    Swiper:
      - pattern: ''
  dom:
    div[data-swiper-slide-index]:
      - pattern: ''
    swiper-container:
      - pattern: ''
    swiper-slide:
      - pattern: ''
    div.swiper-wrapper:
      - pattern: ''
    div.swiper-initialized:
      - pattern: ''
    div.swiper-vertical:
      - pattern: ''
