name: KaTeX
slug: katex
category: js-library
website: https://katex.org/
detect:
  scripts:
    - pattern: 'katex(@|/)[0-9.]+(?:/dist)?/katex(?:\.min)?\.(mjs|js|css)'
      version: 1
  js:
    katex:
      - pattern: ''
    katex.version:
      - pattern: '^(.+)$'
        version: 1
  dom:
    link[href*=katex]:
      - attr: href
        pattern: 'katex(?:\.min)?\.css'
