name: React Router
slug: react-router
category: js-library
website: https://reactrouter.com
implies: [react]
detect:
  scripts:
    - pattern: '(?:/react-router(@|/)([\d.]+)(?:/[a-z]+)?)?/react-router(?:\.min)?\.js'
      version: 2
  js:
    __reactRouterVersion:
      - pattern: '^([\d.]+)'
        version: 1
