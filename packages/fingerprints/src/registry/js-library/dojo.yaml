name: Dojo
slug: dojo
category: js-library
website: https://dojotoolkit.org
detect:
  scripts:
    - pattern: '((?:\d+\.){1,9}\d+)/dojo/dojo(?:\.xd)?\.js'
      version: 1
  js:
    dojo.version:
      - pattern: '^([\d.]+)'
        version: 1
        confidence: 95
    dojo:
      - pattern: ''
    dojo.version.major:
      - pattern: '^(.+)$'
        version: 1
