name: styled-components
slug: styled-components
category: js-library
website: https://styled-components.com
implies: [react]
detect:
  html:
    - pattern: '<style data-styled='
      confidence: 90
  js:
    styled:
      - pattern: ''
  dom:
    style[data-styled]:
      - pattern: ''
    '[sc-component-id]':
      - text: true
        pattern: ''
    style[data-styled-version]:
      - attr: data-styled-version
        pattern: '(^.+$)'
        version: 1
    style[data-styled], style[data-styled-components], [sc-component-id]:
      - text: true
        pattern: ''
