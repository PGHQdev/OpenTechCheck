name: jQuery
slug: jquery
category: js-library
website: https://jquery.com
detect:
  scripts:
    - pattern: 'jquery[/.-](\d+\.[\d.]*\d)[^/]*\.js'
      version: 1
    - pattern: 'jquery(?:\.min)?\.js'
      confidence: 80
    - pattern: 'jquery-[0-9a-f]{12,}(?:\.min)?\.js'
      confidence: 70
    - pattern: '(?:^|/)jquery(?:-(\d+\.[\d.]*\d))?(?:\.min|\.slim|\.slim\.min|\.core|\.migrate)?\.js'
    - pattern: '/jquery(?:-(\d+\.\d+\.\d+))[/.-]'
      version: 1
    - pattern: '/(\d+\.\d+\.\d+)/jquery(?!\.popupoverlay\.js|(?:\.[\w-]*){0,9}fancybox)[/.-][^u]'
      version: 1
  js:
    jQuery.fn.jquery:
      - pattern: '^([\d.]+)'
        version: 1
    $.fn.jquery:
      - pattern: '([\d.]+)'
        version: 1
    jQuery.prototype.jquery:
      - pattern: '([\d.]+)'
        version: 1
