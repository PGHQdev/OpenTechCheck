name: Dailymotion
slug: dailymotion
category: video
website: https://www.dailymotion.com
detect:
  html:
    - pattern: 'dailymotion\.com/embed'
      confidence: 90
  scripts:
    - pattern: 'dailymotion\.com'
      confidence: 90
  meta:
    name:
      - pattern: 'dailymotion-domain-verification'
  dom:
    img[data-src*='.dailymotion.com/'], iframe[scr*='.dailymotion.com/']:
      - pattern: ''
