name: Bulma
slug: bulma
category: ui-framework
website: https://bulma.io
detect:
  html:
    - pattern: 'navbar-burger|hero-body'
      confidence: 85
    - pattern: 'jsdelivr\.net/npm/bulma@([\d.]+)'
      version: 1
    - pattern: 'cdnjs\.cloudflare\.com/ajax/libs/bulma/([\d.]+)'
      version: 1
    - pattern: 'unpkg\.com/bulma@([\d.]+)'
      version: 1
    - pattern: 'href="[^"]*/bulma(?:\.min)?\.css'
      confidence: 70
  js:
    Bulma.VERSION:
      - pattern: '([\d\.]+)'
        version: 1
  dom:
    link[href*='bulma']:
      - attr: href
        pattern: '(?:([\d\.]+)/css/)?bulma(?:-docs)?\.min\.css'
        version: 1
