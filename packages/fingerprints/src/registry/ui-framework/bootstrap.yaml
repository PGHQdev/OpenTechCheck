name: Bootstrap
slug: bootstrap
category: ui-framework
website: https://getbootstrap.com
detect:
  html:
    - pattern: '\bdata-bs-[a-z-]+='
      confidence: 85
    - pattern: 'cdn\.jsdelivr\.net/npm/bootstrap@([\d.]+)'
      version: 1
    - pattern: 'bootstrapcdn\.com/bootstrap/([\d.]+)'
      version: 1
    - pattern: 'href="[^"]*/bootstrap(?:\.min)?\.css'
      confidence: 70
    - pattern: '<style>\s+/\*!\s+\* Bootstrap v(\d\.\d\.\d)'
      version: 1
    - pattern: '<link[^>]* href=[^>]*?/bootstrap(?:[.-]([0-9a-fA-F]{7,40}|[\d]+(?:\.[\d]+){0,2}))?(?:\.min)?\.css'
      version: 1
  scripts:
    - pattern: 'cdn\.jsdelivr\.net/npm/bootstrap@([\d.]+)'
      version: 1
    - pattern: 'bootstrapcdn\.com/bootstrap/([\d.]+)'
      version: 1
    - pattern: '/bootstrap(?:\.bundle)?(?:\.min)?\.js'
      confidence: 70
    - pattern: '/bootstrap(?:[.-](?:bundle|min|esm|js))*(?:[.-]([0-9a-fA-F]{7,40}|[\d]+(?:\.[\d]+){0,2}))?(?:\.bundle)?(?:\.min)?\.js'
      version: 1
  js:
    bootstrap.Tooltip.VERSION:
      - pattern: '^([\d.]+)'
        version: 1
    jQuery.fn.tooltip.Constructor.VERSION:
      - pattern: '^([\d.]+)'
        version: 1
    bootstrap.Alert:
      - pattern: ''
    bootstrap.Alert.VERSION:
      - pattern: '^(.+)$'
        version: 1
  dom:
    body[data-bs-theme]:
      - attr: data-bs-theme
        pattern: '^(.*)$'
    link[href*="cdn.jsdelivr.net/npm/bootstrap"]:
      - attr: href
        pattern: 'bootstrap@([\d.]+)'
    style:
      - text: true
        pattern: '--bs-(?:gutter|emphasis|space-x|tertiary-bg|secondary-color)'
