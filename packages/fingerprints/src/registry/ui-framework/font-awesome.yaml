name: Font Awesome
slug: font-awesome
category: ui-framework
website: https://fontawesome.com
detect:
  html:
    - pattern: 'cdnjs\.cloudflare\.com/ajax/libs/font-awesome/([\d.]+)'
      version: 1
    - pattern: '(?:site-assets|use)\.fontawesome\.com/releases/v([\d.]+)'
      version: 1
    - pattern: 'fontawesome-free-([\d.]+)'
      version: 1
    - pattern: 'href="[^"]*/font-awesome(?:\.min)?\.css'
      confidence: 70
    - pattern: 'class="[^"]*\bfa[srlbd]?\s+fa-[a-z0-9-]+'
      confidence: 70
    - pattern: 'class="[^"]*\bfa-(?:solid|regular|brands|light|duotone|thin|sharp)\b'
      confidence: 70
  scripts:
    - pattern: 'kit\.fontawesome\.com/[0-9a-f]+\.js'
    - pattern: '(?:site-assets|use)\.fontawesome\.com/releases/v([\d.]+)'
      version: 1
    - pattern: 'cdnjs\.cloudflare\.com/ajax/libs/font-awesome/([\d.]+)'
      version: 1
    - pattern: '(?:F|f)o(?:n|r)t-?(?:A|a)wesome(?:.*?([0-9a-fA-F]{7,40}|[\d]+(?:.[\d]+(?:.[\d]+)?)?)|)'
    - pattern: '\.fontawesome\.com/([0-9a-z]+).js'
  js:
    FontAwesomeCdnConfig:
      - pattern: ''
    FontAwesomeKitConfig.asyncLoading:
      - pattern: ''
    ___FONT_AWESOME___:
      - pattern: ''
  dom:
    "[class*='fa']":
      - attr: class
        pattern: '(?:^|\s)fa(?:-[a-z0-9-]+)?(?:\s|$)'
    link[href*='awesome']:
      - attr: href
        pattern: '(?:([\d\.]+)/)?(?:css/)?font-awesome(?:\.min)?\.css'
        version: 1
    link[href*='font-awesome']:
      - attr: href
        pattern: '/font-awesome/([\d\.]+)/css/'
        version: 1
    link[href*='fontawesome-free']:
      - attr: href
        pattern: '/fontawesome-free(?:/|-)([\d\.]+)?'
        version: 1
    link[href*='kit-pro.fontawesome.com']:
      - attr: href
        pattern: '/kit-pro\.fontawesome\.com/releases/v([\d\.]+)/'
        version: 1
