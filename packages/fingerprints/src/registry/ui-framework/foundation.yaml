name: Foundation
slug: foundation
category: ui-framework
website: https://get.foundation
detect:
  html:
    - pattern: 'data-magellan\b|data-dropdown-menu\b'
      confidence: 85
    - pattern: 'jsdelivr\.net/npm/foundation-sites@([\d.]+)'
      version: 1
    - pattern: 'cdnjs\.cloudflare\.com/ajax/libs/foundation/([\d.]+)'
      version: 1
    - pattern: '<link[^>]+(?:foundation(?:-sites|-icons|\.min)?\.css|/foundation/)[^>"]*'
    - pattern: '<div [^>]*class="[^"]*(?:small|medium|large)-\d{1,2} columns'
  scripts:
    - pattern: 'jsdelivr\.net/npm/foundation-sites@([\d.]+)'
      version: 1
    - pattern: 'cdnjs\.cloudflare\.com/ajax/libs/foundation/([\d.]+)'
      version: 1
    - pattern: 'foundation\.(?:core|util\.[a-z]+)(?:\.min)?\.js'
    - pattern: '/foundation(?:\.min)?\.js'
      confidence: 60
  js:
    Foundation.version:
      - pattern: '([\d.]+)'
        version: 1
  dom:
    link[href*='foundation'][href*='css']:
      - pattern: ''
