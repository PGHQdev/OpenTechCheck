name: Materialize CSS
slug: materialize
category: ui-framework
website: https://materializecss.com
detect:
  html:
    - pattern: 'class="[^"]*\b(?:btn-floating|waves-effect|waves-light)'
      confidence: 75
  scripts:
    - pattern: '(?:^|/)materialize(?:\.min)?\.js'
      confidence: 70
    - pattern: '([\d\.]+)/.*/materialize\.min\.js'
      version: 1
  dom:
    link[href*='/materialize.min.css']:
      - pattern: ''
