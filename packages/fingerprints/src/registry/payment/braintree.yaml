name: Braintree
slug: braintree
category: payment
website: https://www.braintreepayments.com
detect:
  html:
    - pattern: 'js\.braintreegateway\.com/web/'
    - pattern: 'braintreegateway\.com/merchants/[a-z0-9]+/verified'
      confidence: 90
  scripts:
    - pattern: 'js\.braintreegateway\.com/'
    - pattern: 'js\.braintreegateway\.com'
  js:
    Braintree:
      - pattern: ''
    Braintree.version:
      - pattern: '^(.+)$'
        version: 1
