name: Cloudflare
slug: cloudflare
category: cdn
website: https://www.cloudflare.com
detect:
  headers:
    server:
      - pattern: '^cloudflare$'
    cf-ray:
      - pattern: ''
    cf-cache-status:
      - pattern: ''
  meta:
    image:
      - pattern: '//cdn\.cloudflare'
  cookies:
    __cfduid:
      - pattern: ''
  js:
    CloudFlare:
      - pattern: ''
  dom:
    img[src*='//cdn.cloudflare']:
      - pattern: ''
