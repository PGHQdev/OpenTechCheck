name: Fastly
slug: fastly
category: cdn
website: https://www.fastly.com
detect:
  headers:
    x-fastly-request-id:
      - pattern: ''
    x-served-by:
      - pattern: '(?:^|,\s)cache-\w+-\w+'
    x-timer:
      - pattern: '^S\d+\.\d+,VS\d'
        confidence: 80
    fastly-debug-digest:
      - pattern: ''
    vary:
      - pattern: 'Fastly-SSL'
    server:
      - pattern: 'Fastly'
    x-fastly-origin:
      - pattern: ''
    x-via-fastly:
      - pattern: ''
