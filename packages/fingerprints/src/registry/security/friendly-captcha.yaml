    - pattern: 'cdn\.jsdelivr\.net/npm/@friendlycaptcha/sdk'
  scripts:
    - pattern: '@friendlycaptcha/sdk'
  js:
    friendlyCaptchaActive:
      - pattern: ''
    friendlyCaptchaVersion:
      - pattern: ''
  dom:
    div.frc-captcha:
      - pattern: ''
