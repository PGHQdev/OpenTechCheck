    - pattern: 'SimpleSAMLphp'
    - pattern: 'simplesamlphp\.org/docs'
  url:
    - pattern: '/module\.php/'
  cookies:
    SimpleSAML:
      - pattern: ''
    SimpleSAMLSessionID:
      - pattern: ''
