name: SvelteKit
slug: sveltekit
category: web-framework
website: https://svelte.dev/docs/kit
implies: [svelte, vite]
detect:
  html:
    - pattern: '\bdata-sveltekit-preload-data\b'
    - pattern: '__sveltekit_[a-z0-9]+'
  scripts:
    - pattern: '/_app/immutable/'
      confidence: 90
  meta:
    generator:
      - pattern: 'SvelteKit'
  dom:
    '#svelte-announcer':
      - pattern: ''
    a,body:
      - attr: data-sveltekit-preload-data
        pattern: ''
      - attr: sveltekit:prefetch
        pattern: ''
