name: Astro
slug: astro
category: web-framework
website: https://astro.build
implies: [vite]
detect:
  html:
    - pattern: '<astro-island\b'
    - pattern: '\bdata-astro-cid-[a-z0-9]+'
  scripts:
    - pattern: '/_astro/'
      confidence: 90
  meta:
    generator:
      - pattern: '^Astro(?:\sv([\d.]+))?'
        version: 1
  js:
    Astro:
      - pattern: ''
  dom:
    "[class^='astro-']":
      - attr: class
        pattern: 'astro-[\d\w]{8,}'
    astro-root:
      - attr: uid
        pattern: ''
    link[href*='/_astro/']:
      - attr: href
        pattern: '/_astro/(?:[\W\w]+)(?:-|\.)[\d\w]+\.css'
    link[href*='/_astro/'][href$='.css']:
      - pattern: ''
