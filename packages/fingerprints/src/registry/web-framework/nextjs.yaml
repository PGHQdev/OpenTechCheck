name: Next.js
slug: nextjs
category: web-framework
website: https://nextjs.org
implies: [react]
detect:
  html:
    - pattern: '__NEXT_DATA__'
    - pattern: 'id="__next"'
      confidence: 60
  scripts:
    - pattern: '/_next/static/'
  headers:
    x-powered-by:
      - pattern: 'Next\.js(?:\s([\d.]+))?'
        version: 1
  js:
    next.version:
      - pattern: '^([\d.]+)'
        version: 1
        confidence: 95
