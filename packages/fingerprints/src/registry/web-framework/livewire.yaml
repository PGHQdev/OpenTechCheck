name: Livewire
slug: livewire
category: web-framework
website: https://livewire.laravel.com
implies: [php]
detect:
  html:
    - pattern: 'wire:id'
      confidence: 95
    - pattern: '<[^>]{1,512}\bwire:'
  scripts:
    - pattern: 'livewire(?:\.min)?\.js'
  js:
    livewire:
      - pattern: ''
    livewireScriptConfig:
      - pattern: ''
