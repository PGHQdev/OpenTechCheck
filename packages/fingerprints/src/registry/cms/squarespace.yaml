name: Squarespace
slug: squarespace
category: cms
website: https://www.squarespace.com
detect:
  html:
    - pattern: 'Static\.SQUARESPACE_CONTEXT'
    - pattern: 'static1\.squarespace\.com'
  scripts:
    - pattern: 'static1\.squarespace\.com'
    - pattern: 'assets\.squarespace\.com'
  headers:
    server:
      - pattern: '^Squarespace$'
  js:
    Squarespace:
      - pattern: ''
    Static.SQUARESPACE_CONTEXT.templateVersion:
      - pattern: '^(\d(?:\.\d)?)$'
        version: 1
