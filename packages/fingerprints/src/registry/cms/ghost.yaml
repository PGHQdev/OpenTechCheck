name: Ghost
slug: ghost
category: cms
website: https://ghost.org
detect:
  html:
    - pattern: '/public/ghost-stats\.min\.js'
    - pattern: 'cdn\.jsdelivr\.net/ghost/portal@'
    - pattern: 'unpkg\.com/@tryghost/portal'
  scripts:
    - pattern: 'cdn\.jsdelivr\.net/ghost/portal@'
    - pattern: '/public/cards\.min\.js'
      confidence: 80
    - pattern: 'unpkg\.com/@tryghost/portal'
  headers:
    ghost-fastly:
      - pattern: ''
    x-ghost-cache-status:
      - pattern: ''
  meta:
    generator:
      - pattern: '^Ghost(?:\s([\d.]+))?'
        version: 1
