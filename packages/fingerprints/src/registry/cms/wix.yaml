name: Wix
slug: wix
category: cms
website: https://www.wix.com
detect:
  html:
    - pattern: 'static\.parastorage\.com'
    - pattern: 'wix-first-paint'
      confidence: 80
  scripts:
    - pattern: 'static\.parastorage\.com'
  headers:
    x-wix-request-id:
      - pattern: ''
    server:
      - pattern: '^Pepyaka$'
    x-wix-renderer-server:
      - pattern: ''
    x-wix-server-artifact-id:
      - pattern: ''
  meta:
    generator:
      - pattern: 'Wix\.com Website Builder'
  cookies:
    _wix_browser_sess:
      - pattern: ''
    Domain:
      - pattern: '\.wix\.com'
  js:
    wixBiSession:
      - pattern: ''
    wixPerformanceMeasurements:
      - pattern: ''
