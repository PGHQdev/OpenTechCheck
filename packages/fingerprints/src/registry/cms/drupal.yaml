name: Drupal
slug: drupal
category: cms
website: https://www.drupal.org
implies: [php]
detect:
  html:
    - pattern: 'data-drupal-selector'
    - pattern: 'data-drupal-link-system-path'
    - pattern: '<(?:link|style)[^>]+"/sites/(?:default|all)/(?:themes|modules)/'
  scripts:
    - pattern: '/core/misc/drupal\.js'
    - pattern: 'drupal\.js'
  headers:
    x-generator:
      - pattern: 'Drupal(?:\s([\d.]+))?'
        version: 1
    x-drupal-cache:
      - pattern: ''
    expires:
      - pattern: '19 Nov 1978'
  meta:
    generator:
      - pattern: 'Drupal(?:\s([\d.]+))?'
        version: 1
  js:
    Drupal:
      - pattern: ''
  dom:
    link[href*='/sites/default/themes/'], link[href*='/sites/all/themes/'], link[href*='/sites/default/modules/'], link[href*='/sites/all/modules/'], style[href*='/sites/default/themes/'], style[href*='/sites/all/themes/'], style[href*='/sites/default/modules/'], style[href*='/sites/all/modules/']:
      - pattern: ''
