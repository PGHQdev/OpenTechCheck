name: Ecwid
slug: ecwid
category: ecommerce
website: https://www.ecwid.com
detect:
  html:
    - pattern: 'app\.ecwid\.com(?::\d+)?/script\.js'
    - pattern: 'xProductBrowser'
  scripts:
    - pattern: 'app\.ecwid\.com(?::\d+)?/script\.js'
    - pattern: 'https://app\.multiscreenstore\.com/script\.js'
    - pattern: 'https://app\.ecwid\.com/script\.js'
  meta:
    generator:
      - pattern: '^ec-instant-site$'
  js:
    Ecwid:
      - pattern: ''
    EcwidCart:
      - pattern: ''
