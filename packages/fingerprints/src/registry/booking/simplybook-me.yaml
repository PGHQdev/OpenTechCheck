name: SimplyBook.me
slug: simplybook-me
category: booking
website: https://simplybook.me
detect:
  scripts:
    - pattern: '\.simplybook\.(?:asia|it|me)'
    - pattern: 'widget\.simplybook\.it'
  js:
    configSoinSimplyPush:
      - pattern: ''
    SimplybookWidget:
      - pattern: ''
