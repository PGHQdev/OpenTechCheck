name: Tealium
slug: tealium
category: tag-manager
website: https://tealium.com
detect:
  html:
    - pattern: 'tags\.tiqcdn\.com/utag/'
    - pattern: 'utag_data'
      confidence: 85
  scripts:
    - pattern: 'tags\.tiqcdn\.com/utag/'
    - pattern: '^(?:https?:)?//tags\.tiqcdn\.com/'
    - pattern: '/tealium/utag\.js$'
  js:
    TEALIUMENABLED:
      - pattern: ''
    TealiumUtils:
      - pattern: ''
    __tealium_twc_switch:
      - pattern: ''
