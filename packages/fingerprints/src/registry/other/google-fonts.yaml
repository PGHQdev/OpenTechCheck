name: Google Fonts
slug: google-fonts
category: other
website: https://fonts.google.com
detect:
  html:
    - pattern: 'href=["\x27](?:https?:)?//fonts\.googleapis\.com/css'
      confidence: 90
  scripts:
    - pattern: 'googleapis\.com/.+webfont'
  js:
    WebFonts:
      - pattern: ''
  dom:
    link[href*='fonts.g']:
      - attr: href
        pattern: 'fonts\.(?:googleapis|google|gstatic)\.com'
    style[data-href*='fonts.g']:
      - attr: data-href
        pattern: 'fonts\.(?:googleapis|google|gstatic)\.com'
