name: Supabase
slug: supabase
category: other
website: https://supabase.com
detect:
  html:
    - pattern: '\.supabase\.co'
      confidence: 90
  scripts:
    - pattern: 'supabase'
      confidence: 80
    - pattern: 'cdn\.supabase\.com'
  js:
    __NUXT__.config.public.SUPABASE_URL:
      - pattern: ''
    __NUXT__.config.public.supabase:
      - pattern: ''
    createClient:
      - pattern: 'supabase\.'
    supabase.AuthAdminApi:
      - pattern: ''
    supabase.storageKey:
      - pattern: ''
  dom:
    a[href*='supabase.com'] > img[src*='/supabase-logo-wordmark\-\-dark.png']:
      - pattern: ''
