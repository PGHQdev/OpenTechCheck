name: React
slug: react
category: js-framework
website: https://react.dev
detect:
  html:
    - pattern: 'data-reactroot'
    - pattern: '\breact(?:\.production)?(?:\.min)?\.js'
      confidence: 70
  js:
    React.version:
      - pattern: '^([\d.]+)'
        version: 1
    '$probe.react':
      - pattern: '^([\d.]+)$'
        version: 1
        confidence: 90
      - pattern: ''
        confidence: 85
  dom:
    '[data-reactroot]':
      - pattern: ''
