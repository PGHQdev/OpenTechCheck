name: Angular
slug: angular
category: js-framework
website: https://angular.dev
detect:
  html:
    - pattern: '\bng-version="([\d.]+)[^"]*"'
      version: 1
    - pattern: '\b_ngcontent-[a-z0-9-]+='
      confidence: 80
  js:
    ng.version.full:
      - pattern: '^([\d.]+)'
        version: 1
    '$probe.angular':
      - pattern: '^(\d+(?:\.\d+){0,3}(?:-[\w.-]+)?(?:\+[\w.-]+)?)$'
        version: 1
        confidence: 90
      - pattern: '^detected$'
        confidence: 90
