name: Aurelia
slug: aurelia
category: js-framework
website: https://aurelia.io
detect:
  html:
    - pattern: 'aurelia-app'
      confidence: 95
  scripts:
    - pattern: '/aurelia[\d\w\-\.]+\.js'
  js:
    _aureliaConfigureModuleLoader:
      - pattern: ''
    localAurelia:
      - pattern: ''
  dom:
    div[aurelia-app], body[aurelia-app], a[au-target-id]:
      - pattern: ''
