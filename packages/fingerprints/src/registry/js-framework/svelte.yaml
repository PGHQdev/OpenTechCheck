name: Svelte
slug: svelte
category: js-framework
website: https://svelte.dev
detect:
  html:
    - pattern: 'class="[^"]*\bsvelte-[a-z0-9]{4,12}\b'
      confidence: 90
    - pattern: '\bdata-sveltekit-preload-data\b'
      confidence: 90
  js:
    __svelte:
      - pattern: ''
    '$probe.svelte':
      - pattern: '^(\d+(?:\.\d+){0,3}(?:-[\w.-]+)?(?:\+[\w.-]+)?)$'
        version: 1
        confidence: 90
      - pattern: '^detected$'
        confidence: 85
