name: release-cws
# Publishes the Chrome extension to the Chrome Web Store and creates a
# GitHub release. Trigger: push a tag like v0.2.0 (the tag version is
# injected into the manifest).
#
# Required repository secrets (Google Cloud OAuth client with the
# chromewebstore scope; see https://developer.chrome.com/docs/webstore/using-api):
#   CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create a GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun run typecheck
      - name: Tests
        run: |
          bun test packages/core packages/fingerprints packages/collect-http
          cd packages/extension && bun test test/

      - name: Inject tag version into manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' packages/extension/manifest/base.json > /tmp/base.json
          mv /tmp/base.json packages/extension/manifest/base.json
          echo "manifest version -> $VERSION"

      - name: Build and zip
        run: |
          cd packages/extension && bun run build
          cd dist/chrome && zip -qr ../../../../opentechcheck-chrome-${GITHUB_REF_NAME}.zip .
          unzip -l ../../../../opentechcheck-chrome-${GITHUB_REF_NAME}.zip | tail -3

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: opentechcheck-chrome-${{ github.ref_name }}.zip
          extension-id: ijggpkkfefnlkinbpkkiihiciffpjnab
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenTechCheck ${{ github.ref_name }}
          body: |
            [Install from the Chrome Web Store](https://chromewebstore.google.com/detail/opentechcheck/ijggpkkfefnlkinbpkkiihiciffpjnab)
          files: opentechcheck-chrome-*.zip
          generate_release_notes: true
