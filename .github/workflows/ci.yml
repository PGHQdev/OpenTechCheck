name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in step `if:`; expose presence as a flag. Fork PRs get no secrets.
      HAS_HARNESS_KEY: ${{ secrets.HARNESS_DEPLOY_KEY != '' && secrets.R2_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun run typecheck
      - name: Unit tests (core, fingerprints, collect-http)
        run: bun test packages/core packages/fingerprints packages/collect-http
      - name: Require fixture access on main
        if: github.event_name == 'push' && env.HAS_HARNESS_KEY != 'true'
        run: |
          echo "::error::HARNESS_DEPLOY_KEY or the R2 secrets are missing; the fixture suite cannot run"
          exit 1
      - name: Check out private fixtures
        if: env.HAS_HARNESS_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: PGHQdev/OpenTechCheckHarness
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
          persist-credentials: false
          path: harness
          sparse-checkout: |
            fixtures
            scripts/fixtures-store.ts
          sparse-checkout-cone-mode: false
      - name: Pull fixture bundles from R2
        if: env.HAS_HARNESS_KEY == 'true'
        run: bun harness/scripts/fixtures-store.ts pull --dir harness/fixtures
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Fixture suite
        if: env.HAS_HARNESS_KEY == 'true'
        run: bun test packages/fingerprints/test/fixtures.test.ts packages/fingerprints/test/prefilter.test.ts
        env:
          OTC_FIXTURES: harness/fixtures
      - name: Extension unit tests
        run: cd apps/extension && bun test test/
      - name: Extension build
        run: cd apps/extension && bun run build
      - name: Extension e2e
        run: cd apps/extension && bun test e2e/
